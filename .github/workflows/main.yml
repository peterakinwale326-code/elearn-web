name: E-Learning Web Platform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      # Inject BOTH missing modules right here
      - name: Inject Missing Dependencies
        run: npm install dotenv @google/genai --no-save

      - name: Build Application
        run: npm run build

      - name: Run Curriculum Seed Script (If Modified)
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "curriculum.json"; then
            echo "🚀 curriculum.json change detected. Running seed script..."
            touch .env.local
            node --env-file=.env.local scripts/seed-curriculum.mjs
          else
            echo "⏭️ No changes to curriculum.json. Skipping seed script."
          fi
