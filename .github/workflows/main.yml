name: E-Learning Web Platform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the codebase with full history to compare file changes
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: elearning/package-lock.json

      # Step 3: Install dependencies inside your elearning folder
      - name: Install Dependencies
        working-directory: ./elearning
        run: npm ci

      # Step 4: Verify the application compiles cleanly
      - name: Build Application
        working-directory: ./elearning
        run: npm run build

      # Step 5: Conditionally execute seed script using native git checks
      - name: Run Curriculum Seed Script (If Modified)
        working-directory: ./elearning
        run: |
          # Check if the curriculum.json file was changed in the commit history
          if git diff --name-only HEAD~1 HEAD | grep -q "elearning/curriculum.json"; then
            echo "🚀 curriculum.json change detected. Running seed script..."
            touch .env.local
            node --env-file=.env.local scripts/seed-curriculum.mjs
          else
            echo "⏭️ No changes to curriculum.json. Skipping seed script."
          fi
