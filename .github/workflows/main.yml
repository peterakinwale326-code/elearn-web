name: E-Learning Web Platform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the codebase using a valid stable action version
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: elearning/package-lock.json

      # Step 3: Install dependencies inside your specific elearning folder
      - name: Install Dependencies
        working-directory: ./elearning
        run: npm ci

      # Step 4: Verify the application compilation process runs smoothly
      - name: Build Application
        working-directory: ./elearning
        run: npm run build
        
      # Step 5: Detect changes to files to determine if curriculum database seed runs
      - name: Check for curriculum.json changes
        id: file-check
        uses: jobsahr/file-changes-action@v1.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
      # Step 6: Execute the database seed script conditionally with an environment stub file
      - name: Run Curriculum Seed Script (Conditional Verification)
        if: contains(steps.file-check.outputs.files, 'elearning/curriculum.json')
        working-directory: ./elearning
        run: |
          touch .env.local
          node --env-file=.env.local scripts/seed-curriculum.mjs
